services:
  - type: web
    name: candycraze-backend
    runtime: docker
    plan: free
    region: oregon
    branch: dev
    buildCommand: ""
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: MONGODB_URI
        sync: false
      - key: MONSTER_GOOGLE_CLIENT_ID
        sync: false
      - key: MONSTER_GOOGLE_CLIENT_SECRET
        sync: false
      - key: MONSTER_MONGODB_DATABASE
        value: monstermerge
      - key: PUBLIC_URL
        value: https://candycraze.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONSTER_PLAY_ENABLED
        value: "false"
      - key: MONSTER_PLAY_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: MONSTER_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
